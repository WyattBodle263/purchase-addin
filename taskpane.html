<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Medical — Purchase Request</title>
<script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #08080f;
    color: #e8e8f0;
    padding: 16px;
    font-size: 13px;
    line-height: 1.5;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid #1e1e35;
  }
  .mark {
    width: 28px; height: 28px; background: #7C3AED;
    border-radius: 5px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 11px;
    color: #fff; letter-spacing: .5px; flex-shrink: 0;
  }
  .header-text .title { font-size: 13px; font-weight: 700; }
  .header-text .sub   { font-size: 10px; color: #7a7a9a; }

  .field { margin-bottom: 13px; }
  .field label {
    display: block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    color: #7a7a9a; margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    width: 100%; background: #0d0d1a;
    border: 1px solid #2a2a48; border-radius: 5px;
    color: #e8e8f0; padding: 7px 10px; font-size: 12px;
    font-family: inherit; outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: #7C3AED;
  }
  .field select option { background: #0d0d1a; }

  .toggle-label {
    display: block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    color: #7a7a9a; margin-bottom: 6px;
  }
  .toggle-row { display: flex; gap: 6px; margin-bottom: 13px; }
  .toggle-btn {
    flex: 1; padding: 8px 4px; border: 1px solid #2a2a48;
    border-radius: 5px; background: transparent; color: #7a7a9a;
    font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all .15s; text-align: center;
  }
  .toggle-yes.on { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.4); color: #22c55e; }
  .toggle-no.on  { background: rgba(120,120,140,.1); border-color: #2a2a48; color: #e8e8f0; }

  .submit-btn {
    width: 100%; padding: 10px; background: #7C3AED;
    border: none; border-radius: 6px; color: #fff;
    font-size: 13px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-top: 6px; transition: background .15s;
  }
  .submit-btn:hover { background: #a855f7; }
  .submit-btn:disabled { background: #3d1f78; color: #7a7a9a; cursor: not-allowed; }

  .status { margin-top: 10px; padding: 8px 12px; border-radius: 5px; font-size: 12px; display: none; }
  .status.ok      { display:block; background:rgba(34,197,94,.1);  color:#22c55e; border:1px solid rgba(34,197,94,.25); }
  .status.error   { display:block; background:rgba(239,68,68,.1);  color:#ef4444; border:1px solid rgba(239,68,68,.25); }
  .status.loading { display:block; background:rgba(124,58,237,.1); color:#a855f7; border:1px solid rgba(124,58,237,.25); }
</style>
</head>
<body>

<div class="header">
  <div class="mark">FM</div>
  <div class="header-text">
    <div class="title">Purchase Request</div>
    <div class="sub">Field Medical</div>
  </div>
</div>

<div class="field">
  <label>Description / Item Requested *</label>
  <textarea id="description" rows="3" placeholder="What needs to be purchased?"></textarea>
</div>

<div class="field">
  <label>Supplier</label>
  <input type="text" id="supplier" placeholder="e.g. McMaster-Carr, DigiKey, Amazon">
</div>

<div class="field">
  <label>Estimated Total ($)</label>
  <input type="number" id="estimatedTotal" placeholder="0.00" step="0.01" min="0">
</div>

<div class="field">
  <label>Department</label>
  <select id="department">
    <option value="">Select department</option>
    <option value="VT">VT</option>
    <option value="Test Tools">Test Tools</option>
    <option value="FieldBending">FieldBending</option>
    <option value="Management">Management</option>
    <option value="Other">Other</option>
  </select>
</div>

<div>
  <span class="toggle-label">Used in a product?</span>
  <div class="toggle-row">
    <button class="toggle-btn toggle-yes on" id="btn-yes" onclick="setForProduct(true)">Yes — route via Receiving</button>
    <button class="toggle-btn toggle-no"     id="btn-no"  onclick="setForProduct(false)">No — general purchase</button>
  </div>
</div>

<div class="field">
  <label>Additional Notes</label>
  <textarea id="notes" rows="2" placeholder="Any context…"></textarea>
</div>

<button class="submit-btn" id="submit-btn" onclick="submitRequest()">Submit Purchase Request</button>
<div class="status" id="status"></div>

<script>
let forProduct = true;
let emailContext = null;

Office.onReady(info => {
  if (info.host === Office.HostType.Outlook) {
    const item = Office.context.mailbox.item;
    if (item) {
      // Pre-fill description from subject
      if (item.subject) document.getElementById('description').value = item.subject;
      emailContext = {
        subject:       item.subject || '',
        messageId:     item.itemId  || '',
        senderEmail:   item.sender?.emailAddress || Office.context.mailbox.userProfile.emailAddress || '',
        senderName:    item.sender?.displayName  || Office.context.mailbox.userProfile.displayName  || '',
      };
    }
  }
});

function setForProduct(val) {
  forProduct = val;
  document.getElementById('btn-yes').className = 'toggle-btn toggle-yes' + (val  ? ' on' : '');
  document.getElementById('btn-no').className  = 'toggle-btn toggle-no'  + (!val ? ' on' : '');
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className   = 'status ' + type;
}

async function submitRequest() {
  const description    = document.getElementById('description').value.trim();
  const supplier       = document.getElementById('supplier').value.trim();
  const estimatedTotal = parseFloat(document.getElementById('estimatedTotal').value) || 0;
  const department     = document.getElementById('department').value;
  const notes          = document.getElementById('notes').value.trim();

  if (!description) { showStatus('Description is required.', 'error'); return; }

  document.getElementById('submit-btn').disabled = true;
  showStatus('Sending purchase request…', 'loading');

  const payload = {
    requesterEmail:  emailContext?.senderEmail || '',
    requesterName:   emailContext?.senderName  || '',
    subject:         `Field Medical Purchase Request: ${description}`,
    messageId:       emailContext?.messageId   || '',
    description,
    supplier,
    estimatedTotal,
    forProduct,
    department,
    notes,
  };

  const jsonBody = JSON.stringify(payload, null, 2);

  // Send email to procurement inbox — scan-inbox route will parse it
  try {
    Office.context.mailbox.item.displayReplyAllForm({
      htmlBody: `
        <p>New purchase request from the Field Medical Purchasing addin.</p>
        <pre style="font-family:monospace;font-size:12px;background:#f5f5f5;padding:12px;border-radius:4px;white-space:pre-wrap">${jsonBody}</pre>
      `,
    });
  } catch(e) {
    // displayReplyAllForm may not be available in all contexts — fallback to direct API
  }

  // Also try direct API call (works when addin is hosted in same-origin context)
  try {
    const r = await fetch('/api/field/purchase-requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (r.ok) {
      showStatus('Purchase request submitted. The procurement team will review it shortly.', 'ok');
      document.getElementById('submit-btn').disabled = false;
      return;
    }
  } catch(e) { /* non-fatal — email route is the primary mechanism */ }

  showStatus('Request sent via email. The procurement team will review it shortly.', 'ok');
  document.getElementById('submit-btn').disabled = false;
}
</script>
</body>
</html>
